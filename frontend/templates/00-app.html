<script id="tpl-app" type="text/ractive">
{{{iconSprite}}}
{{! §3.2 sync strip — the Requests tab is read-only and this is the sentence
    that says WHY, so it renders on the populated view and on the empty state
    alike. Defined once as an inline partial (Ractive requires partial
    definitions at the top level of the template) and used in both branches. }}
{{#partial reqSyncStrip}}
  <div class="syncstrip">
    <svg class="i18" aria-hidden="true"><use href="#i-trello" /></svg>
    <span class="sstext">Difficulty, list and Figma links are read from Trello and can't be edited here.</span>
    <span class="ssmeta">{{syncStripLabel}}</span>
  </div>
{{/partial}}
<header class="shellnav">
  <div class="shellrow">
    <nav class="crumbs" aria-label="Breadcrumb">
      <span class="crumb-root">Frost: Sirius</span>
      <span class="crumb-sep">{{{icon.crumbChevron}}}</span>
      <span class="crumb-here" aria-current="page">{{tabLabel}}</span>
    </nav>
    <div class="shellctl">
      <div class="proj">
        <span class="projlabel">PROJECT</span>
        {{#if boardId}}<a class="boardlink" href="https://trello.com/b/{{boardId}}" target="_blank">{{boardId}} {{{icon.extLink}}}</a>{{/if}}
      </div>
      <div class="projselect">
        <select class="project-switcher" value="{{activeProjectId}}" on-change="['switchProject']" aria-label="Project">
          {{#each projects as p}}<option value="{{p._id}}">{{p.name}}</option>{{/each}}
        </select>
      </div>
      <span class="synced {{#if sync && !sync.ok}}bad{{/if}}">{{syncLabel}}</span>
      <div class="userchip">
        <span class="avatar">{{userInitial}}</span>
        <span class="who"><span class="name">{{userName}}</span><button class="sub" on-click="['signOut']">Sign out</button></span>
      </div>
    </div>
  </div>
  <div class="tabbar" role="tablist" aria-label="Sections" on-keydown="['tabKey']">
    {{#each tabs as t}}
      <button id="tab-{{t.id}}" class="tab {{#if t.id === activeTab}}active{{/if}}" role="tab" aria-selected="{{t.id === activeTab ? 'true' : 'false'}}" aria-controls="view-panel" tabindex="{{t.id === activeTab ? '0' : '-1'}}" on-click="['switchTab', t.id]"><span class="ticon">{{{tabIcon(t.icon)}}}</span>{{t.label}}</button>
    {{/each}}
    <span class="tabfill" role="presentation"></span>
  </div>
</header>

{{#if banner}}<div class="banner">{{banner}}</div>{{/if}}

<main class="view {{activeTab === 'pipeline' || activeTab === 'requests' ? '' : 'legacybg'}}" id="view-panel" role="tabpanel" aria-labelledby="tab-{{activeTab}}">

{{#if activeTab === 'requests'}}
  {{#if requests.length || rejects.length}}
  <div class="reqstack">
    <!-- §3 breakdown stat bar — counts always from the UNFILTERED set; the
         segments are the single-select status filter (click again clears).
         Real buttons: Enter/Space activation is the platform's job -->
    <div class="metrics rstats" role="group" aria-label="Request breakdown">
      {{#each reqStats as s}}
        <button type="button" class="metric rstat {{s.cls}} {{#if statOff(s.key)}}off{{/if}}" aria-pressed="{{requestFilter === s.key ? 'true' : 'false'}}" on-click="['setRequestFilter', s.key]"><span class="mlabel">{{s.label}}</span><span class="mvalue">{{s.value}}</span></button>
      {{/each}}
    </div>

    {{>reqSyncStrip}}

    <div class="searchbar reqsearch">{{{icon.search}}}<input name="requests-search" placeholder="Search cards or MC#" value="{{reqQ}}" lazy="250" aria-label="Search requests by card or MC number" /></div>

    <!-- filter bar: four selects (options derived from the loaded rows) plus
         the pager; every control here filters CLIENT-SIDE, one fetch per load -->
    <div class="filterbar">
      {{#each reqFilterDefs as f}}
        <div class="rfilter">
          <span class="flabel">{{f.label}}</span>
          <div class="selwrap">
            <button class="seltrigger {{#if f.value !== ''}}on{{/if}}" on-click="['openReqMenu', f.key]" aria-haspopup="listbox" aria-expanded="{{reqMenu === f.key ? 'true' : 'false'}}" aria-label="{{f.label}} filter">
              <span class="selval">{{f.value === '' ? 'All' : f.value}}</span><span class="bchev"><svg class="i16"><use href="#i-badgeChevron" /></svg></span>
            </button>
            {{#if reqMenu === f.key}}
              <div class="selectmenu reqmenu" role="listbox" aria-label="{{f.label}}" style="left:{{reqMenuPos.left}}px;top:{{reqMenuPos.top}}px;">
                <div class="selecthead">{{f.label}}</div>
                <button class="selectitem {{#if f.value === ''}}on{{/if}}" role="option" aria-selected="{{f.value === '' ? 'true' : 'false'}}" on-click="['pickReqFilter', f.key, '']">All</button>
                {{#each f.options as o}}
                  <button class="selectitem {{#if f.value === o}}on{{/if}}" role="option" aria-selected="{{f.value === o ? 'true' : 'false'}}" on-click="['pickReqFilter', f.key, o]">{{o}}</button>
                {{/each}}
              </div>
            {{/if}}
          </div>
        </div>
      {{/each}}

      {{#if reqPageCount > 1}}
        <nav class="pager" aria-label="Requests pages">
          <button class="pnav prev" disabled="{{reqPage <= 1}}" on-click="['reqPageStep', -1]" aria-label="Previous page"><svg class="i16"><use href="#i-rowChevron" /></svg></button>
          {{#each reqPages as p}}
            {{#if p.gap}}<span class="pgap" aria-hidden="true">…</span>
            {{else}}<button class="pbtn {{#if p.n === reqPage}}on{{/if}}" aria-current="{{p.n === reqPage ? 'page' : 'false'}}" on-click="['reqGoPage', p.n]">{{p.n}}</button>{{/if}}
          {{/each}}
          <button class="pnav" disabled="{{reqPage >= reqPageCount}}" on-click="['reqPageStep', 1]" aria-label="Next page"><svg class="i16"><use href="#i-rowChevron" /></svg></button>
        </nav>
      {{/if}}
    </div>

    {{#if reqFiltered.length}}
    <div class="pscrollwrap reqwrap">
      <div class="pscroll" on-scroll="['reqScrolled']">
        <table class="ptable rtable">
          <!-- owl #18: every column sorts except Brief and Frost Notes, which
               carry no sort key in reqCols and so render as plain headers. The
               sortable ones are real <button>s — Enter/Space activation is the
               platform's job, as with the stat segments above. -->
          <thead><tr>
            {{#each reqCols as c}}
              {{#if c.sort}}
                <th class="{{c.cls}}" aria-sort="{{reqSortKey === c.sort ? (reqSortDir === 'desc' ? 'descending' : 'ascending') : 'none'}}">
                  <button type="button" class="sortbtn" on-click="['reqSortBy', c.sort]" aria-label="Sort by {{c.label}}">
                    <span>{{c.label}}</span>
                    {{#if reqSortKey === c.sort}}<svg class="i16 sarrow {{reqSortDir}}" aria-hidden="true"><use href="#i-badgeChevron" /></svg>{{/if}}
                  </button>
                </th>
              {{else}}
                <th class="{{c.cls}}">{{c.label}}</th>
              {{/if}}
            {{/each}}
          </tr></thead>
          <tbody>
          {{#each reqRows as r}}
            <tr>
              <!-- YEAR / MONTH ride the payload as-is; monthShort is the ONE
                   place the sheet's month encoding is normalised (a full name,
                   1-12 or an abbreviation all render 'Aug') -->
              <td class="col-ryear">{{#if r.year}}<span class="rtext nowrap">{{r.year}}</span>{{else}}<span class="emdash">—</span>{{/if}}</td>
              <td class="col-rmonth">{{#if r.month}}<span class="rtext nowrap">{{monthShort(r.month)}}</span>{{else}}<span class="emdash">—</span>{{/if}}</td>
              <td class="col-rmc"><div class="mcstack">
                <span class="mcval">{{{hlr(r.mc_number)}}}</span>
                {{#if r.sheet_row}}
                  {{#if sheetRowUrl(r.sheet_row)}}
                    <a class="sheetrow" href="{{sheetRowUrl(r.sheet_row)}}" target="_blank" rel="noopener" title="Open row {{r.sheet_row}} in the intake sheet">row {{r.sheet_row}} {{{icon.extLink}}}</a>
                  {{else}}
                    <span class="sheetrow">row {{r.sheet_row}}</span>
                  {{/if}}
                {{/if}}
              </div></td>
              <td class="col-rname"><span class="rtext">{{{hlr(r.name)}}}</span></td>
              <td class="col-rtype">{{#if r.asset_type}}<span class="rbadge">{{{hlr(r.asset_type)}}}</span>{{else}}<span class="emdash">—</span>{{/if}}</td>
              <td class="col-rcase"><span class="rtext">{{{hlr(r.use_case)}}}</span></td>
              <td class="col-rwho">{{#if r.requestor}}<span class="rbadge">{{{hlr(r.requestor)}}}</span>{{else}}<span class="emdash">—</span>{{/if}}</td>
              <!-- invariant 14: the server resolves Trello due over sheet deadline; the tooltip names which -->
              <td class="col-rdue">{{#if r.deadline}}<span class="rtext nowrap" title="{{r.deadline_source === 'trello' ? 'From Trello due date' : 'From intake sheet'}}">{{fmtLong(r.deadline)}}</span>{{else}}<span class="nopill">none</span>{{/if}}</td>
              <td class="col-rbrief">{{#if r.brief}}<span class="rtext" title="{{r.brief}}">{{{hlr(clip180(r.brief))}}}</span>{{else}}<span class="emdash">—</span>{{/if}}</td>
              <!-- STATUS is two-valued (owls #34/#35): filed or not. There is no
                   third badge, so the class map is a straight either/or and the
                   TEXT is the server's own string, never re-typed here. -->
              <td class="col-rstatus"><span class="sbadge {{r.status === statusFiled ? 'pipe' : 'file'}}">{{r.status}}</span></td>
              <!-- FR-11 note cell. ONE freeform box in the editor (owl #15) and
                   one resolved text everywhere else — noteText() joins any
                   legacy clarify_reason in, so no branch repeats that. The
                   clarification block keys on the SHARED clarified() predicate
                   — the same one the FOR CLARIFICATION segment uses — so a
                   FILED row that still carries the flag renders the plain
                   remark box (In Pipeline wins, FR-11.3) and the clarification
                   signal lives only here, never in the status. The buttons name
                   themselves with the note TEXT: an aria-label overrides the
                   contents of a button, so a bare "Edit note for MC-###" would
                   read the affordance aloud and hide the note it is showing. -->
              <td class="col-rnote"><div class="notewrap">
                {{#if noteEditing === r.mc_number}}
                  <div class="noteedit" on-keydown="['noteKeydown']">
                    <textarea rows="3" class="{{#if noteDraft.clarify}}flagged{{/if}}" placeholder="Add a remark or a clarification" value="{{noteDraft.remark}}" autofocus></textarea>
                    <label class="nchk"><input type="checkbox" checked="{{noteDraft.clarify}}" /> With Clarification</label>
                    <div class="nsub">Marks the request as not fileable yet</div>
                    {{#if noteError}}<span class="nerr">{{noteError}}</span>{{/if}}
                    <div class="nbtns"><button class="nghost" on-click="['cancelNote']">Cancel</button><button class="nsubmit" on-click="['submitNote', r.mc_number]">Submit</button></div>
                  </div>
                {{elseif clarified(r)}}
                  <button class="notebox flagged" on-click="['openNote', r.mc_number]" title="Edit note" aria-label="Edit note for {{r.mc_number}} — with clarification: {{noteText(r.note)}}">
                    <span class="clarpill">With Clarification</span>
                    <span class="clarnote">{{{hlr(noteText(r.note))}}}</span>
                  </button>
                {{elseif noteText(r.note)}}
                  <button class="notebox" on-click="['openNote', r.mc_number]" title="Edit note" aria-label="Edit note for {{r.mc_number}}: {{noteText(r.note)}}">{{{hlr(noteText(r.note))}}}</button>
                {{else}}
                  <button class="addremark" on-click="['openNote', r.mc_number]">Add Remarks</button>
                {{/if}}
              </div></td>
            </tr>
          {{/each}}
          </tbody>
        </table>
      </div>
      {{#if reqThumb.needed}}
      <div class="hslider">
        <button class="hnudge" on-click="['nudgeScroll', -1]" aria-label="Scroll table left">{{{icon.sliderLeft}}}</button>
        <div class="htrack" on-click="['trackJump']"><div class="hthumb" style="left:{{reqThumb.left}}%;width:{{reqThumb.width}}%;"></div></div>
        <button class="hnudge" on-click="['nudgeScroll', 1]" aria-label="Scroll table right">{{{icon.sliderRight}}}</button>
      </div>
      {{/if}}
    </div>
    <!-- the empty state REPLACES the table — a header-only table over its own
         scroll slider is not an empty state — and names the real cause:
         filters only when rows exist to hide, otherwise the sheet itself.
         The outer gate owns the no-data case, so the last branch here can
         only mean every parsed row landed in rejects. -->
    {{elseif requests.length}}
      <div class="rempty"><strong>No requests match</strong><span>Clear the search, the status card or a filter to see the other rows.</span></div>
    {{else}}
      <div class="rempty"><strong>No usable requests</strong><span>Every row the sync read needs correction in the sheet — it corrects on the next sync.</span></div>
    {{/if}}
  </div>
  {{else}}
    <div class="reqstack">
      {{>reqSyncStrip}}
      <div class="rempty">
        <strong>No requests loaded</strong>
        <span>The intake sheet mirror is deferred until the sheet stabilises. The sync service reads it server-side — nothing is edited here, ever.</span>
      </div>
    </div>
  {{/if}}
{{/if}}

{{#if activeTab === 'pipeline'}}
  <div class="metrics">
    <div class="metric"><span class="mlabel">MAIN CARDS</span><span class="mvalue">{{kpi.main}}</span></div>
    <div class="metric"><span class="mlabel">WORK CARDS</span><span class="mvalue">{{kpi.work}}</span></div>
    <div class="metric"><span class="mlabel">OPEN WORK</span><span class="mvalue">{{kpi.open}}</span></div>
    <div class="metric red"><span class="mlabel">URGENT</span><span class="mvalue">{{kpi.urgent}}</span></div>
  </div>

  <div class="pipestack">
  <!-- owl #36: the incomplete-card banner that used to sit here is gone. The
       same three conditions now speak on the row that owns them (.prow.warn
       below); the aggregate is the OPEN WORK metric above, which still counts
       `corrections`. A warned row the search hides stays hidden — no special
       case, which is exactly why the KPI keeps carrying the total. -->

  <div class="searchbar">{{{icon.search}}}<input name="pipeline-search" placeholder="Search cards or MC#" value="{{searchQ}}" lazy="250" aria-label="Search cards or MC number" /></div>

  <div class="pscrollwrap">
    <div class="pscroll" on-scroll="['pipeScrolled']">
      <table class="ptable">
        <thead><tr>
          <th class="col-mc">MC #</th><th class="col-name">Card Name</th><th class="col-type">Type</th>
          <th class="col-diff">Difficulty</th><th class="col-urgency">Urgency</th><th class="col-status">Status</th>
          <th class="col-client">Client</th><th class="col-due">Due</th><th class="col-started">Started</th>
          <th class="col-done">Done</th><th class="col-links">Links</th>
        </tr></thead>
        <tbody>
        {{#each pipelineRows as row}}
          <!-- .warn is PRESENTATION ONLY (owl #36): the row keeps its one
               keyboard behaviour (Enter expands the group) and not one of its
               controls is disabled by an incomplete card. The MESSAGE in
               col-name is the only new click target. -->
          <tr class="prow {{#if row.blocker}}blocked{{/if}} {{#if rowWarning(row)}}warn{{/if}}" tabindex="0" on-keydown="['pipeRowKey', row.mcNumber]">
            <td class="col-mc"><div class="mccell">
              <button class="chevbtn {{#if expanded[row.mcNumber]}}open{{/if}}" on-click="['toggleGroup', row.mcNumber]" aria-label="{{row.displayId}} work cards" aria-expanded="{{expanded[row.mcNumber] ? 'true' : 'false'}}"><svg class="i16"><use href="#i-rowChevron" /></svg></button>
              <span class="mcnum">{{{hl(row.mcLabel)}}}</span>
            </div></td>
            <td class="col-name"><span class="cardname">{{{hl(row.name)}}}</span>{{#if row.blocker}} <span class="pbadge blocked">🛑 {{row.blocker}}</span>{{/if}}
              <!-- the label is a VARIABLE string (rowWarning().label) in all
                   three places it appears — the message, its accessible name
                   and the popover title — so renaming it renames it once. -->
              {{#if rowWarning(row)}}
                <div class="warnwrap">
                  <button class="warnmsg" on-click="['openWarnPop', row.cardId]" aria-haspopup="dialog"
                          aria-expanded="{{warnPop === row.cardId ? 'true' : 'false'}}"
                          aria-label="{{rowWarning(row).label}} — {{row.mcLabel}} {{row.name}}">
                    <svg class="i10" aria-hidden="true"><use href="#i-warning" /></svg><span class="warnlabel">{{rowWarning(row).label}}</span>
                  </button>
                  {{#if warnPop === row.cardId}}
                    <div class="warnpop" role="dialog" aria-label="{{rowWarning(row).label}} — {{row.mcLabel}} {{row.name}}" style="left:{{warnPopPos.left}}px;top:{{warnPopPos.top}}px;">
                      <div class="wphead"><svg class="i16" aria-hidden="true"><use href="#i-warning" /></svg><span class="wptitle">{{rowWarning(row).label}}</span></div>
                      <div class="wpitems">
                        {{#each rowWarning(row).items as it}}
                          <div class="wpitem"><span class="wplabel">{{it.label}}</span><span class="wpwhy">{{it.why}}</span></div>
                        {{/each}}
                      </div>
                      <!-- the separator exists only to divide the details from
                           Open Card, so a card Trello has no URL for draws
                           neither: one conditional, not two -->
                      {{#if row.trelloUrl}}<div class="wpsep"></div><a class="wpopen" href="{{row.trelloUrl}}" target="_blank" rel="noopener">Open Card</a>{{/if}}
                    </div>
                  {{/if}}
                </div>
              {{/if}}
            </td>
            <td class="col-type">{{#if row.assetType}}<span class="pbadge">{{{hl(row.assetType)}}}</span>{{else}}<span class="dimcell">—</span>{{/if}}</td>
            <td class="col-diff"><div class="ubadge-wrap">
              <button class="pbadge ubadge {{#if row.difficulty}}d-{{row.difficulty}}{{else}}unset{{/if}} {{#if savingDifficulty[row.cardId]}}saving{{/if}}"
                disabled="{{savingDifficulty[row.cardId] || !writesEnabled}}"
                on-click="['openDiffMenu', row.cardId]" aria-haspopup="listbox" aria-expanded="{{diffMenu === row.cardId ? 'true' : 'false'}}"
                title="{{writesEnabled ? 'Writes the Difficulty label to the Trello card (write registry W3)' : 'Read-only project — Trello writes are disabled'}}">
                <span>{{#if savingDifficulty[row.cardId]}}saving…{{else}}{{row.difficulty || '—'}}{{/if}}</span><span class="bchev"><svg class="i16"><use href="#i-badgeChevron" /></svg></span>
              </button>
              {{#if diffMenu === row.cardId}}
                <div class="selectmenu" role="listbox" aria-label="Difficulty" style="left:{{diffMenuPos.left}}px;top:{{diffMenuPos.top}}px;">
                  <div class="selecthead">Difficulty</div>
                  <button class="selectitem {{#if row.difficulty === 'Easy'}}on{{/if}}" role="option" aria-selected="{{row.difficulty === 'Easy' ? 'true' : 'false'}}" on-click="['chooseDifficulty', row.cardId, 'Easy', row.difficulty]"><span class="dot green"></span>Easy</button>
                  <button class="selectitem {{#if row.difficulty === 'Medium'}}on{{/if}}" role="option" aria-selected="{{row.difficulty === 'Medium' ? 'true' : 'false'}}" on-click="['chooseDifficulty', row.cardId, 'Medium', row.difficulty]"><span class="dot amber"></span>Medium</button>
                  <button class="selectitem {{#if row.difficulty === 'Hard'}}on{{/if}}" role="option" aria-selected="{{row.difficulty === 'Hard' ? 'true' : 'false'}}" on-click="['chooseDifficulty', row.cardId, 'Hard', row.difficulty]"><span class="dot red"></span>Hard</button>
                </div>
              {{/if}}
            </div></td>
            <td class="col-urgency"><div class="ubadge-wrap">
              <button class="pbadge ubadge {{row.urgency === 'Urgent' ? 'urgent' : 'nonurgent'}} {{#if savingUrgency[row.cardId]}}saving{{/if}}"
                disabled="{{savingUrgency[row.cardId] || !writesEnabled}}"
                on-click="['openUrgencyMenu', row.cardId]" aria-haspopup="listbox" aria-expanded="{{urgencyMenu === row.cardId ? 'true' : 'false'}}"
                title="{{writesEnabled ? 'Writes the Urgent label to the Trello card (write registry W1)' : 'Read-only project — Trello writes are disabled'}}">
                <span>{{#if savingUrgency[row.cardId]}}saving…{{elseif row.urgency === 'Urgent'}}⚡ Urgent{{else}}{{row.urgency}}{{/if}}</span><span class="bchev"><svg class="i16"><use href="#i-badgeChevron" /></svg></span>
              </button>
              {{#if urgencyMenu === row.cardId}}
                <div class="selectmenu" role="listbox" aria-label="Urgency" style="left:{{urgencyMenuPos.left}}px;top:{{urgencyMenuPos.top}}px;">
                  <div class="selecthead">Urgency</div>
                  <button class="selectitem {{#if row.urgency === 'Urgent'}}on{{/if}}" role="option" aria-selected="{{row.urgency === 'Urgent' ? 'true' : 'false'}}" on-click="['chooseUrgency', row.cardId, 'Urgent', row.urgency]"><span class="dot red"></span>Urgent</button>
                  <button class="selectitem {{#if row.urgency !== 'Urgent'}}on{{/if}}" role="option" aria-selected="{{row.urgency !== 'Urgent' ? 'true' : 'false'}}" on-click="['chooseUrgency', row.cardId, 'Non-Urgent', row.urgency]"><span class="dot slate"></span>Non-Urgent</button>
                </div>
              {{/if}}
            </div></td>
            <td class="col-status">{{#if row.currentList}}<span class="pbadge s-{{row.status}}" title="{{row.statusNote ? 'Manual note: ' + row.statusNote : 'Trello list, classified by keyword'}}">{{{hl(row.currentList)}}}</span>{{else}}<span class="dimcell">—</span>{{/if}}</td>
            <td class="col-client">{{#if row.requestor}}<span class="pbadge">{{{hl(row.requestor)}}}</span>{{else}}<span class="dimcell">—</span>{{/if}}</td>
            <td class="col-due"><div class="duewrap">
              {{#if writesEnabled}}
                <button class="datefield {{row.deadline ? (row.overdue ? 'overdue' : '') : 'missing'}} {{#if savingDeadline[row.cardId]}}saving{{/if}}"
                  disabled="{{savingDeadline[row.cardId]}}"
                  on-click="['openDuePopover', row.cardId]" aria-haspopup="dialog" aria-expanded="{{duePopover === row.cardId ? 'true' : 'false'}}"
                  title="{{row.deadline ? 'Source: ' + row.deadlineSource : 'No due date'}} — Apply writes the Trello due date (write registry W2)">
                  <span class="dpdate">{{#if savingDeadline[row.cardId]}}saving…{{elseif row.deadline}}{{fmtLong(row.deadline)}}{{else}}Select Date{{/if}}</span><svg class="i16"><use href="#i-calendar" /></svg>
                </button>
                {{#if duePopover === row.cardId}}
                  <div class="duepop" role="dialog" aria-label="Due date" style="left:{{duePopPos.left}}px;top:{{duePopPos.top}}px;">
                    <div class="duehead">
                      <button class="duenav prev" on-click="['dueNav', -1]" aria-label="Previous month"><svg class="i16"><use href="#i-rowChevron" /></svg></button>
                      <span class="duemonth">{{dueMonthLabel(dueMonth)}}</span>
                      <button class="duenav" on-click="['dueNav', 1]" aria-label="Next month"><svg class="i16"><use href="#i-rowChevron" /></svg></button>
                    </div>
                    <div class="duedow" aria-hidden="true">{{#each dowNames as d}}<span>{{d}}</span>{{/each}}</div>
                    <div class="duegrid">
                      {{#each dueGrid(dueMonth, dueStaged) as c}}
                        <button class="dueday {{#if c.out}}out{{/if}} {{#if c.today}}today{{/if}} {{#if c.on}}on{{/if}}" on-click="['duePick', c.iso]" aria-pressed="{{c.on ? 'true' : 'false'}}" aria-label="{{fmtLong(c.iso)}}">{{c.day}}</button>
                      {{/each}}
                    </div>
                    <div class="dueshort">
                      <button on-click="['dueShortcut', 'today']">Today</button>
                      <button on-click="['dueShortcut', 'week']">In 1 Week</button>
                      <button on-click="['dueShortcut', 'monday']">Next Monday</button>
                    </div>
                    <div class="dueact">
                      <button class="dueclear" disabled="{{!row.trelloDue}}" on-click="['dueClear', row.cardId]" title="{{row.trelloDue ? 'Clear the Trello due date — the sheet deadline (if any) takes over' : (row.deadline ? 'This date comes from the intake sheet — Sirius cannot clear it' : 'No due date to clear')}}">Clear Due Date</button>
                      <button class="dueapply" on-click="['dueApply', row.cardId]">Apply</button>
                    </div>
                  </div>
                {{/if}}
              {{else}}

      One shell, one table, one banner recipe. Every edit is a DRAFT: Save

      already audits it as one `sprints.replace`), Cancel discards because
      openSprints re-copies from `sprints` on the next open. Nothing is written
      per row, and no sprint reference is ever written onto a deliverable —
      membership stays derived from the slotted week (invariant 12 / R5).

      Two rulings the frame itself does not draw: column 1 holds the remove ✕
      and NOT the frame's six-dot grip (R-f-6 — `position` is derived from the
      sorted start dates on save, so a grip would drag nothing, the same trap
      Feature 3 is deleting from the Gantt gutter), and the frame's hidden
      `offset-subtone` hint strip is not rendered (R-f-7 — it is hidden in all
      three table states and the stated 812×416 only adds up without it). }}
  {{#if sprintModal}}
    <div class="modal-back" on-click="['closeSprints']">

          </button>

        <p class="smexplain">Sprints are not a fixed cadence – set whatever periods the project actually runs. A deliverable belongs to whichever sprint contains  its slotted week.</p>

        {{#if sprintDraft.length}}
          <div class="stable">
            <div class="sthead">
              <span class="sthc sc-rm"></span>
              <span class="sthc sc-name">NAME</span>
              <span class="sthc sc-start">START (MON)</span>
              <span class="sthc sc-end">END (FRI)</span>
              <span class="sthc sc-len">LENGTH</span>
            </div>
            <div class="strows">
              {{! ONE banner recipe, three modifiers: .warn = amber and
                  non-blocking (gaps), .err = red and blocks Save (duplicate
                  names, overlaps), .sconfirm = the deletion warning. Neither
                  .warn nor .err carries a CTA — Miles removed the frame's
                  "Delete sprint" / "Keep it" buttons (R-f-5) — and the Alert
                  Banner component's unused 1450px List-Item / items-container
                  variant slots are not in the markup at all.

                  The markup appears at two positions rather than once through a
                  partial because Ractive accepts partial DEFINITIONS only at
                  the top level of a template, and the render harness slices
                  this modal out of it as a subtree — a partial defined outside
                  the slice would not resolve. Both copies are byte-identical
                  and read `.variant`, and the styling is a single CSS recipe.

                  Duplicates lead the list: they name no pair, so there is no
                  "between" for them to sit in (R-f-4 governs gaps/overlaps). }}

                <div class="sbanner {{b.variant}}" role="alert">
                  <div class="sbhead">
                    {{#if b.variant === 'err'}}<svg class="i16" aria-hidden="true"><use href="#i-alertCircle" /></svg>{{else}}<svg class="i15" aria-hidden="true"><use href="#i-warning" /></svg>{{/if}}
                    <span class="sbtitle">{{b.title}}</span>
                  </div>
                  <p class="sbdesc">{{b.text}}</p>
                </div>
              {{/each}}
              {{#each sprintDraft as s: i}}
                <div class="strow">
                  <span class="stc sc-rm">
                    <button class="strm" type="button" on-click="['removeSprint', i]"
                            title="Remove {{s.name}}" aria-label="Remove {{s.name}}">
                      <svg class="i16" aria-hidden="true"><use href="#i-close" /></svg>
                    </button>
                  </span>
                  <span class="stc sc-name">
                    <input class="stin" type="text" value="{{s.name}}" aria-label="Sprint {{ i + 1 }} name" />
                  </span>
                  {{! R-f-2 — the picker SNAPS on change (never rejects): START
                      to the Monday of the week picked, END to that week's
                      Friday. `change`, not `input`: some engines fire `input`
                      per keystroke and would rewrite a half-typed date. }}
                  <span class="stc sc-start">
                    <input class="stin stdate" type="date" value="{{s.start}}" on-change="['snapSprintStart', i]"
                           aria-label="{{s.name}} start — snaps to Monday" />
                  </span>
                  <span class="stc sc-end">
                    <input class="stin stdate" type="date" value="{{s.end}}" on-change="['snapSprintEnd', i]"
                           aria-label="{{s.name}} end — snaps to Friday" />
                  </span>
                  <span class="stc sc-len"><span class="stlen">{{sprintLength(s)}}</span></span>
                </div>
                {{! Miles's ruling (#30): removing a sprint that covers slotted
                    deliverables warns with the COUNT first. The count is read
                    off the rows already loaded; nothing persists until Save. }}
                {{#if sprintDeleteConfirm && sprintDeleteConfirm.idx === i}}
                  <div class="sbanner sconfirm" role="alertdialog" aria-label="Confirm sprint removal">
                    <div class="sbhead">
                      <svg class="i15" aria-hidden="true"><use href="#i-warning" /></svg>
                      <span class="sbtitle">Remove {{sprintDeleteConfirm.name}}?</span>
                    </div>
                    <p class="sbdesc">{{sprintDeleteConfirm.count}} deliverables will move to Outside any sprint.</p>
                    <div class="sbctas">
                      <button class="smbtn ghost" type="button" on-click="['cancelRemoveSprint']">Cancel</button>
                      <button class="smbtn danger" type="button" on-click="['confirmRemoveSprint']">Remove sprint</button>
                    </div>
                  </div>
                {{/if}}
                {{! R-f-3 / R-f-4 — one banner per situation, rendered BETWEEN
                    the two rows it names; each carries the draft index of the
                    row it follows, so placement is data. Read outward from the
                    row: blank name (blocking, about THIS row), then overlaps
                    (blocking, about the pair), then gaps (advisory). }}
                {{#each sprintBlankNames.concat(sprintOverlaps, sprintGaps) as b}}
                  {{#if b.after === i}}
                    <div class="sbanner {{b.variant}}" role="{{ b.variant === 'err' ? 'alert' : 'status' }}">
                      <div class="sbhead">
                        {{#if b.variant === 'err'}}<svg class="i16" aria-hidden="true"><use href="#i-alertCircle" /></svg>{{else}}<svg class="i15" aria-hidden="true"><use href="#i-warning" /></svg>{{/if}}
                        <span class="sbtitle">{{b.title}}</span>
                      </div>
                      <p class="sbdesc">{{b.text}}</p>
                    </div>
                  {{/if}}
                {{/each}}
              {{/each}}
            </div>
            <div class="staddrow">
              <button class="stadd" type="button" on-click="['addSprint']">
                <svg class="i16" aria-hidden="true"><use href="#i-plus" /></svg>Add Sprint
              </button>
            </div>
          </div>
        {{else}}
          {{! R-f-1 — the copy is "Add Sprint" in BOTH states; the frame's empty
              state reads "Add a Sprint" and flags its own inconsistency. }}
          <div class="smempty">
            <div class="smemptytop">
              <span class="smemptyt">No sprints yet</span>
              <span class="smemptysub">Until you add one, everything scheduled sits in a single ungrouped list.</span>
            </div>
            <button class="smbtn primary" type="button" on-click="['addSprint']">Add Sprint</button>
          </div>
        {{/if}}

        <div class="smctas">
          {{#if sprintError}}<span class="smerr" role="alert">{{sprintError}}</span>{{/if}}
          {{! contract §1.1 — the empty state dims Cancel's LABEL to --slate-400.
              It stays live (it always closes the modal); the state modifier
              tracks the rendered branch, so it is on exactly when the empty
              block above is. }}
          <button class="smbtn ghost {{#if !sprintDraft.length}}dim{{/if}}" type="button" on-click="['closeSprints']">Cancel</button>
          {{! #37, superseding R7 — Save is live when there is something to
              persist and nothing blocking it: `sprintDirty` and no error
              banner. One rule covers the whole class — opened with no sprints
              is not a change, emptied BY the user is (the route takes an empty
              list and audits the replace like any other), and an edit put back
              is not one again. }}
          <button class="smbtn primary" type="button" on-click="['saveSprints']"
                  disabled="{{ sprintDupNames.length || sprintOverlaps.length || sprintBlankNames.length || !sprintDirty }}"
                  {{#if sprintDupNames.length || sprintOverlaps.length || sprintBlankNames.length}}title="Fix the errors above to save"{{/if}}>Save sprints</button>
        </div>
      </div>
    </div>
  {{/if}}
{{/if}}

{{#if activeTab === 'deadlines'}}
  <div class="toolbar">
    <button class="navbtn" on-click="['monthShift', -1]">‹</button>
    <span class="rangetitle">{{monthLabel}}</span>
    <button class="navbtn" on-click="['monthShift', 1]">›</button>
    <span class="note soft" style="margin:0 0 0 auto;">🔒 Reference only. Dates follow Sprint Schedules — replotting happens there.</span>
  </div>
  <div class="kpis">
    <div class="kpi"><div class="klabel">Due this month</div><div class="kvalue">{{dueThisMonth}}</div></div>
    <div class="kpi red"><div class="klabel">Urgent</div><div class="kvalue">{{urgentThisMonth}}</div></div>
    <div class="kpi orange"><div class="klabel">Conflicts</div><div class="kvalue">{{deadlineConflicts.length}}</div></div>
    <div class="kpi purple"><div class="klabel">Needs replotting</div><div class="kvalue">{{replot.length}}</div></div>
  </div>

  {{#each deadlineConflicts as c}}
    <div class="conflict {{c.rule}}">
      <button class="ack" on-click="['ackConflict', c.key]" title="Acknowledge — silences THIS situation only; any change to the cards involved, or to the project's weekly capacity, brings it back">✕</button>
      <span class="ctag">{{ruleLabel(c.rule)}} · {{fmt(c.week)}}</span> — {{c.explanation}}
      <div class="chips">{{#each c.items as i}}<span class="badge">{{i.displayId}} · {{i.phase}}</span>{{/each}}</div>
    </div>
  {{/each}}
  {{#if acknowledged.length}}
    <div class="note soft">Acknowledged ({{acknowledged.length}}) —
      {{#each acknowledged as a}}
        <span class="badge">{{ruleLabel(a.rule)}} {{fmt(a.week)}}{{#if a.ack && a.ack.reason}} · “{{a.ack.reason}}”{{/if}}</span>
        <button class="chip" on-click="['restoreConflict', a.key]">restore</button>
      {{/each}}
    </div>
  {{/if}}

  {{#if replot.length}}
    <div class="replotcard"><div class="rtitle">RAISE WITH THE PM FOR REPLOTTING</div>
      {{#each replot as r}}<div class="rrow"><span class="mono">{{r.displayId}}</span><span>{{r.name}}</span><span class="dim">{{r.reasons.join(' · ')}}</span></div>{{/each}}
    </div>
  {{/if}}

  <div class="dim" style="margin-top:0.6rem;">Click a week to plan its days. Drag an entry between days, or focus it and use ←/→; Backspace returns it to the forecast day. Day moves never change the week — replotting happens on Sprint Schedules.</div>
  <div class="weekgrid">
    {{#each deadlineWeeks as w}}
      <div class="weekcard {{#if w.flagged}}flagged{{/if}} {{#if expandedWeek === w.key}}expanded{{/if}}">
        <div class="whead">
          <button class="wtitle wexpand" on-click="['toggleWeek', w.key]" aria-label="{{expandedWeek === w.key ? 'Collapse' : 'Expand'}} {{w.label}} to days">{{expandedWeek === w.key ? '▾' : '▸'}} {{w.label}}</button>
          <span class="wmeta">{{fmtLoad(w.load)}} cards' worth due{{#if w.urgent}} · {{w.urgent}} urgent{{/if}}</span>
        </div>
        <div class="wsub">{{w.sub}}</div>
        <div class="capbar"><div class="fill" style="width:{{w.capPct}}%;"></div></div>
        <div class="capnote">{{fmtLoad(w.load)}} / {{capacity.weekly}} cards</div>
        {{#if expandedWeek === w.key}}
          <div class="daygrid">
            {{#each dayCols(w.key) as d}}
              <div class="daycol {{#if d.holiday}}holiday{{/if}} {{#if d.load > d.capacity}}over{{/if}}"
                   on-dragover="['dayDragOver', d.holiday]" on-drop="['dropOnDay', d.day, d.holiday]">
                <div class="dhead">{{dayName(d.day)}} <span class="dcap">{{#if d.holiday}}holiday{{else}}{{fmtLoad(d.load)}}/{{d.capacity}}{{/if}}</span></div>
                {{#each d.items as m}}
                  <div class="entry {{#if m.late}}late{{elseif m.urgent}}urgent{{/if}}" draggable="true" tabindex="0"
                       on-dragstart="['dragMilestone', m.cardId, m.phase]"
                       on-keydown="['milestoneKey', m.cardId, m.phase, d.day, w.key]"
                       aria-label="{{m.displayId}} {{m.phase}} on {{dayName(d.day)}} — arrows move the day">
                    <span class="who">{{m.displayId}}</span>
                    <span class="badge {{m.phase}}">{{m.phase}}</span>
                    {{#if m.plannedDay}}<button class="chev" on-click="['clearDayPlan', m.cardId, m.phase]" title="Back to the forecast day">✕</button>{{/if}}
                  </div>
                {{/each}}
              </div>
            {{/each}}
          </div>
        {{else}}
          {{#each w.items as m}}
            <div class="entry {{#if m.late}}late{{elseif m.urgent}}urgent{{/if}}">
              <span class="who">{{m.displayId}}</span>
              <span class="badge {{m.phase}}">{{m.phase}}</span>
              {{#if m.urgent}}<span class="badge urgentchip">⚡</span>{{/if}}
              {{#if m.late}}<span class="badge bad">late</span>{{/if}}
              {{#if m.plannedDay}}<span class="badge" title="Day set by hand — the forecast day is {{fmt(m.date)}}">📍 {{dayName(m.plannedDay)}}</span>{{/if}}
              <span class="edate">{{fmt(m.plannedDay || m.date)}}</span>
              {{#if m.trelloUrl}}<a href="{{m.trelloUrl}}" target="_blank">↗</a>{{/if}}
            </div>
          {{/each}}
        {{/if}}
      </div>
    {{/each}}
  </div>
{{/if}}

{{#if activeTab === 'forecast'}}
  {{#if modelProvenance}}
    <div class="greenpanel">
      <div class="gtitle">✦ Forecast from measured delivery — {{modelProvenance.source}}{{#if modelProvenance.fallback}} · <span class="badge warn">snapshot fallback</span>{{/if}}</div>
      <div class="gstats">
        <span class="gstat"><span class="glabel">Median review wait</span><br /><span class="gvalue">{{modelReview.median}} d</span></span>
        <span class="gstat"><span class="glabel">70th percentile</span><br /><span class="gvalue">{{modelReview['0.7']}} d</span></span>
        <span class="gstat"><span class="glabel">85th percentile</span><br /><span class="gvalue">{{modelReview['0.85']}} d</span></span>
        <span class="gstat"><span class="glabel">95th percentile</span><br /><span class="gvalue">{{modelReview['0.95']}} d</span></span>
      </div>
      <div class="gnote">Design time is keyed on difficulty <em>and</em> lane. Review n={{modelReview.n}}. The retired spreadsheet model put review waits at 12.5–22 days against these measured values.</div>
    </div>
  {{/if}}
  <p class="explain">Same column names as the Delivery Forecast sheet, so the team reads it unchanged. Difficulty comes from the Trello card label and can’t be edited here; Confidence is the platform’s own lever. <strong>Review SLA</strong> is the manual override — enter actual review days and it replaces the modelled review time for that card, which drives Forecasted Review Time and every date to its right.</p>

  <div class="scroll"><table class="grid">
    <thead><tr><th>Request</th><th>Difficulty</th><th>Confidence</th><th class="slahead">Sketch SLA</th><th class="slahead">Render SLA</th>
      <th>Sketch Delivery Date</th><th>Sketch Approved</th><th>Render Delivery Date</th><th>Render Approved</th>
      <th>Baseline Review</th><th>Forecasted Review Time</th><th>Total Cycle Time</th><th>n</th></tr></thead>
    <tbody>
    {{#each forecastRows as row}}
      <tr>
        <td class="clip"><span class="mono">{{row.displayId}}</span> / {{row.name}}</td>
        <td><span class="badge d-{{row.difficulty}}">{{row.difficulty || '—'}}</span></td>
        <td><select value="{{row.confidence}}" on-change="['setConfidence', row.cardId]">
          <option value="Average">Average</option><option value="0.7">70th pct</option><option value="0.85">85th pct</option><option value="0.95">95th pct</option>
        </select></td>
        <td><input class="sla" type="number" min="0" step="0.5" value="{{row.slaSketch}}" on-change="['setSla', row.cardId, 'sla_sketch']" /></td>
        <td><input class="sla" type="number" min="0" step="0.5" value="{{row.slaRender}}" on-change="['setSla', row.cardId, 'sla_render']" /></td>
        {{#if row.forecast}}
          <td class="nowrap"><strong>{{fmt(row.forecast.sketchDelivery)}}</strong></td><td class="nowrap">{{fmt(row.forecast.sketchApproved)}}</td>
          <td class="nowrap {{#if row.forecast.late}}redtext{{/if}}"><strong>{{fmt(row.forecast.renderDelivery)}}</strong></td><td class="nowrap">{{fmt(row.forecast.renderApproved)}}</td>
          <td class="dim">{{(row.forecast.sketchReview * 2).toFixed(2)}}</td>
          <td>{{row.forecast.forecastedReviewTime.toFixed(2)}}</td>
          <td><strong>{{row.forecast.totalCycleTime.toFixed(2)}}</strong></td>
          <td class="dim">{{row.forecast.sampleSize}}</td>
        {{else}}<td colspan="8" class="dim">no difficulty — cannot forecast</td>{{/if}}
      </tr>
    {{/each}}
    </tbody>
  </table></div>
  {{#if modelProvenance}}
    <div class="provenance">Model cells {{modelProvenance.cells}} · sample sizes shown per row (n) · recomputed nightly from a rolling window (FR-7.6)</div>
  {{/if}}
{{/if}}

{{#if activeTab === 'admin'}}
  <h2 class="admin-title">Access — who can use Sirius</h2>
  {{#if adminError}}
    <div class="note danger">{{adminError}} <button class="badge togglable" on-click="['adminDismiss']">dismiss</button></div>
  {{/if}}

  <div class="admin-add">
    <h3>Add a person</h3>
    <div class="admin-form">
      <input type="email" placeholder="name@frostdesigngroup.com" value="{{adminForm.email}}" aria-label="Email address" />
      <input type="text" placeholder="Name (optional)" value="{{adminForm.name}}" aria-label="Name" />
      <div class="admin-projects">
        {{#each adminProjects as p}}
          <label class="chk"><input type="checkbox" checked="{{adminForm.projectIds[p.id]}}" /> {{p.code}} · {{p.name}}</label>
        {{/each}}
      </div>
      <button class="badge togglable addbtn" on-click="['adminAdd']">＋ Add person</button>
    </div>
    <div class="dim">Only @frostdesigngroup.com accounts — they sign in with Google after being added here. No emails are sent. Admins are managed from the server, not this screen.</div>
  </div>

  {{! Owl #23 — capacity lock, admin-only. Reuses the shipped badge recipes
      (.badge ok / .badge bad / .badge togglable) rather than a second button
      recipe; every toggle is audited server-side. }}
  <div class="admin-add">
    <h3>Capacity lock</h3>
    <div class="dim">A locked project refuses every cards/week change until an admin unlocks it. The planner slider renders locked, with the reason on it.</div>
    {{#each adminProjects as p}}
      <div class="caplockrow">
        <span>{{p.code}} · {{p.name}}</span>
        {{#if p.capacityLocked}}
          <span class="badge bad">locked</span>
          <button class="badge togglable" on-click="['adminSetCapacityLock', p.id, false]">unlock</button>
        {{else}}
          <span class="badge ok">unlocked</span>
          <button class="badge togglable" on-click="['adminSetCapacityLock', p.id, true]">lock</button>
        {{/if}}
      </div>
    {{/each}}
  </div>

  <div class="tablewrap"><table>
    <thead><tr><th>Email</th><th>Name</th><th>Projects</th><th>Status</th><th>Last sign-in</th><th></th></tr></thead>
    <tbody>
    {{#each adminUsers as u}}
      <tr class="{{#if !u.active}}inactive-row{{/if}}">
        <td class="nowrap">{{u.email}} {{#if u.admin}}<span class="badge ok">admin</span>{{/if}}</td>
        <td class="dim">{{u.name || '—'}}</td>
        <td>
          {{#if adminEditing === u.id}}
            {{#each adminProjects as p}}
              <label class="chk"><input type="checkbox" checked="{{adminEditSel[p.id]}}" /> {{p.code}}</label>
            {{/each}}
            <button class="badge togglable" on-click="['adminSaveEdit', u.id]">save</button>
            <button class="badge togglable" on-click="['adminCancelEdit']">cancel</button>
          {{else}}
            {{#each u.projectIds as pid}}<span class="badge">{{projCode(pid)}}</span> {{/each}}
            <button class="badge togglable" on-click="['adminEdit', u.id]" title="Edit project access" aria-label="Edit project access for {{u.email}}">✎</button>
          {{/if}}
        </td>
        <td>{{#if u.active}}<span class="badge ok">active</span>{{else}}<span class="badge bad">deactivated</span>{{/if}}</td>
        <td class="dim nowrap">{{fmtWhen(u.lastLoginAt)}}</td>
        <td class="nowrap">
          {{#if u.active}}
            <button class="badge togglable" on-click="['adminToggleActive', u.id, true]" title="They lose access on their next request">deactivate</button>
          {{else}}
            <button class="badge togglable" on-click="['adminToggleActive', u.id, false]">reactivate</button>
          {{/if}}
        </td>
      </tr>
    {{/each}}
    </tbody>
  </table></div>
{{/if}}

</main>
</script>
